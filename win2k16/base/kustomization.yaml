# Microsoft Windows Server 2016 boot source: the shared build in windows/build with this version's parameters (os.env).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- install-iso.yaml
configMapGenerator:
- name: windows-OS-install-params     # renamed to windows-2k16-install-params by windows/build
  namespace: kubevirt-gitops
  envs:
  - os.env
  options:
    disableNameSuffixHash: true
components:
- ../../windows/build
# Server 2016 cumulative updates are slow and need more rounds: allow 10h instead of 6h
# (the build Job and the monthly rebuild CronJob)
patches:
- target:
    kind: Job
  patch: |-
    - op: replace
      path: /spec/activeDeadlineSeconds
      value: 36000
- target:
    kind: CronJob
  patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/activeDeadlineSeconds
      value: 36000
