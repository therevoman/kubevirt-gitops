apiVersion: argoproj.io/v1beta1
kind: Application
metadata:
  name: vms
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    namespace: kubevirt-gitops
    server: https://kubernetes.default.svc
  project: default
  source:
    path: vms
    repoURL: https://github.com/therevoman/kubevirt-gitops.git
    targetRevision: ocs
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
