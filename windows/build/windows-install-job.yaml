apiVersion: batch/v1
kind: Job
metadata:
  name: windows-OS-install
  namespace: kubevirt-gitops
  annotations:
    # Under Argo CD this runs after every sync; install.sh exits at once if the boot source exists.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600      # 6h hard stop; install.sh fails sooner on a stuck build
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: windows-OS-install
      restartPolicy: Never
      containers:
      - name: ose-cli
        # Pinned minor tag (patch releases only). The build uses basic oc commands, so a newer
        # client works against older clusters. Bump together with the virtio-win fallback in install.sh.
        image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
        command: ["/bin/bash", "/scripts/install.sh"]
        envFrom:
        - configMapRef:
            name: windows-OS-install-params
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: windows-OS-install-scripts
