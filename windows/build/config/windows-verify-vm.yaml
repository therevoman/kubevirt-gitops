# Throwaway VM that checks a new boot source before it is published (install.sh, verify_image).
# It boots a clone of the sysprepped disk the way a template clone would: specialize, OOBE,
# SetupComplete, then cloudbase-init runs the user data from @VERIFY_SECRET@. install.sh reads the
# file that user data writes through the guest agent. The TPM block is dropped unless TPM=true.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  annotations:
    name.os.template.kubevirt.io/@BOOT_SOURCE@: @OS_NAME@
    description: @VERIFY_NAME@ (check of a new @BOOT_SOURCE@ boot source; deleted when it passes)
  labels:
    app: @VERIFY_NAME@
  name: @VERIFY_NAME@
spec:
  runStrategy: Always
  dataVolumeTemplates:
  - metadata:
      name: @VERIFY_NAME@-rootdisk
    spec:
      source:
        pvc:
          namespace: @VERIFY_SOURCE_NS@
          name: @VERIFY_SOURCE_PVC@
      storage:                         # StorageProfile picks accessModes/volumeMode
        resources:
          requests:
            storage: @DISK_SIZE@
  template:
    metadata:
      annotations:
        vm.kubevirt.io/os: @OS_ID@
        vm.kubevirt.io/workload: @WORKLOAD@
      labels:
        kubevirt.io/domain: @VERIFY_NAME@
        vm.kubevirt.io/name: @VERIFY_NAME@
    spec:
      architecture: amd64
      domain:
        clock:
          timer:
            hpet:
              present: false
            hyperv: {}
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup
          utc: {}
        cpu:
          sockets: 1
          cores: 2
          threads: 1
        memory:
          guest: 4Gi
        devices:
          disks:
          - name: rootdisk
            bootOrder: 1
            disk:
              bus: sata                # same bus the image was built and sysprepped on
          - name: cloudinitdisk
            cdrom:
              bus: sata                # Windows reads the NoCloud ISO only from a CD-ROM
          # @IF_TPM@
          tpm: {}                      # Windows 11 requires TPM 2.0
          # @END_TPM@
          inputs:
          - bus: usb
            name: tablet
            type: tablet
          interfaces:
          - name: default
            model: virtio
            masquerade: {}
          rng: {}
        features:
          acpi: {}
          apic: {}
          smm: {}
          hyperv:
            frequencies: {}
            ipi: {}
            reenlightenment: {}
            relaxed: {}
            reset: {}
            runtime: {}
            spinlocks:
              spinlocks: 8191
            synic: {}
            synictimer:
              direct: {}
            tlbflush: {}
            vapic: {}
            vpindex: {}
        firmware:
          bootloader:
            efi:
              secureBoot: true
      evictionStrategy: None
      hostname: @VERIFY_NAME@
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 60
      volumes:
      - name: rootdisk
        dataVolume:
          name: @VERIFY_NAME@-rootdisk
      - name: cloudinitdisk
        cloudInitNoCloud:
          secretRef:
            name: @VERIFY_SECRET@      # created by install.sh: user data that writes the check file
