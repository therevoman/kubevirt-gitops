apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: @BOOT_SOURCE@
  namespace: openshift-virtualization-os-images
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
    kubevirt.ui/provider: Microsoft
spec:
  source:
    pvc:
      namespace: @BUILD_NAMESPACE@
      name: @NAME@-rootdisk
  # No accessModes/volumeMode: the StorageProfile picks them (RWX Block on ODF, RWO on LVMS).
  storage:
    resources:
      requests:
        storage: @DISK_SIZE@        # the templates clone this size; must not exceed it
