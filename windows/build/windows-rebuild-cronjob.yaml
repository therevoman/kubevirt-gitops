# Monthly rebuild (E2): a fresh build with the latest updates into <BOOT_SOURCE>-<YYYY-MM>, checked
# (E1) and then published as the boot source. Suspended by default; a cluster turns it on in
# clusters/<cluster>/windows/kustomization.yaml. The pod template is copied from the Job
# windows-OS-install by this Component's replacements, so both always run the same thing; install.sh
# sees from the Job name (windows-<OS>-rebuild-...) that it is a rebuild.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: windows-OS-rebuild
  namespace: kubevirt-gitops
spec:
  schedule: "0 1 15 * *"            # replaced by REBUILD_SCHEDULE from os.env
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400    # a missed run (cluster down) still starts within a day
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600  # same as the Job; a version that patches one patches both
      template: {}                  # replaced by the Job's pod template
