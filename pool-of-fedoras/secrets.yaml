---
apiVersion: v1
kind: Secret
metadata:
  name: fedora-cloudinit
  namespace: pool-of-fedoras
stringData:
  userData: |-
    #cloud-config
    user: fedora
    password: redhat
    chpasswd: { expire: False }
    #package_upgrade: true
    #package_reboot_if_required: true
    package_install_recommends: true
    packages:
      - httpd
      - firewall-config
    runcmd:
      - [ dnf, install, httpd, -y ]
      - [ systemctl, start, httpd ]
      - [ systemctl, enable, httpd ]
      - [ firewall-cmd, --permanent, --add-service=http ]
      - [ firewall-cmd, --permanent, --add-service=https ]
      - [ firewall-cmd, --reload ]
      - [ /bin/bash, -c, echo "<h1>Hello from your Fedora cloud instance</h1><br/><h2>Hostname is $(hostname)</h2>" > /var/www/html/index.html ]
