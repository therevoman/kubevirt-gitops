apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: win11-install-iso
  namespace: kubevirt-gitops
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
    kubevirt.ui/provider: Microsoft
spec:
  source:
    http:
      url: http://webserver.example.com/windows/Win11_25H2_English_x64.iso     # environments/<env>/windows replaces http://webserver.example.com
  storage:
    resources:
      requests:
        storage: 12Gi
