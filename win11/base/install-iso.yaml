apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: win11-install-iso
  namespace: kubevirt-gitops
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
    kubevirt.ui/provider: Microsoft
spec:
  source:
    http:
      url: http://webserver.example.com/windows/win-11-25h2.iso     # the environment's ISO_BASE_URL replaces http://webserver.example.com (windows/environment)
  storage:
    resources:
      requests:
        storage: 12Gi
