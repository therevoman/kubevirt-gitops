# Demo VM cloned from the fedora DataSource. No password: log in with the SSH key from Secret
# vm-ssh-key, which the QEMU guest agent adds for user "fedora" (see vms/README.md).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora-gitops1
  labels:
    app: fedora-gitops1
    vm.kubevirt.io/template: fedora-server-small
  annotations:
    vm.kubevirt.io/validations: |
      [{"name": "minimal-required-memory", "path": "jsonpath::.spec.domain.memory.guest", "rule": "integer",
        "message": "This VM requires more memory.", "min": 1610612736}]
spec:
  runStrategy: Always
  dataVolumeTemplates:
  - metadata:
      name: fedora-gitops1
    spec:
      sourceRef:
        kind: DataSource
        name: fedora
        namespace: openshift-virtualization-os-images
      storage:
        resources:
          requests:
            storage: 30Gi
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: fedora
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/domain: fedora-gitops1
        kubevirt.io/size: small
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 4Gi
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
            model: virtio
          rng: {}
      accessCredentials:
      - sshPublicKey:
          source:
            secret:
              secretName: vm-ssh-key
          propagationMethod:
            qemuGuestAgent:
              users:
              - fedora
      evictionStrategy: LiveMigrate
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
      - name: rootdisk
        dataVolume:
          name: fedora-gitops1
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |-
            #cloud-config
            user: fedora
