# Example environment settings for the Windows boot-source builds (see windows/environment).
apiVersion: v1
kind: ConfigMap
metadata:
  name: windows-environment-settings
  annotations:
    config.kubernetes.io/local-config: "true"   # build-time only; not applied to the cluster
data:
  # Replaces "http://webserver.example.com" in each winXX/base install ISO URL. The ISOs must be
  # at <ISO_BASE_URL>/windows/<file>, with the file names from winXX/base/install-iso.yaml.
  ISO_BASE_URL: http://isos.example.org/isos
