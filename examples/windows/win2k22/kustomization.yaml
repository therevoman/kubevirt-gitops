# Microsoft Windows Server 2022 example VM, cloned from DataSource win2k22: oc apply -k examples/windows/win2k22 -n <namespace>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: windows-example-settings
  literals:
  - BOOT_SOURCE=win2k22
  - OS_ID=windows2k22
  - DISK_SIZE=60Gi                # same as win2k22/base/os.env
  options:
    disableNameSuffixHash: true
    annotations:
      config.kubernetes.io/local-config: "true"
components:
- ../base
