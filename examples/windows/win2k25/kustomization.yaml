# Microsoft Windows Server 2025 example VM, cloned from DataSource win2k25: oc apply -k examples/windows/win2k25 -n <namespace>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: windows-example-settings
  literals:
  - BOOT_SOURCE=win2k25
  - OS_ID=windows2k25
  - DISK_SIZE=60Gi                # same as win2k25/base/os.env
  options:
    disableNameSuffixHash: true
    annotations:
      config.kubernetes.io/local-config: "true"
components:
- ../base
