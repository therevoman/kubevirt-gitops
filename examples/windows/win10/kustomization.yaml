# Microsoft Windows 10 example VM, cloned from DataSource win10: oc apply -k examples/windows/win10 -n <namespace>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: windows-example-settings
  literals:
  - BOOT_SOURCE=win10
  - OS_ID=windows10
  - DISK_SIZE=60Gi                # same as win10/base/os.env
  options:
    disableNameSuffixHash: true
    annotations:
      config.kubernetes.io/local-config: "true"
components:
- ../base
