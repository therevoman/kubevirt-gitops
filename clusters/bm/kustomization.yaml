# App-of-apps for cluster "bm": oc apply -k clusters/bm
# Creates ApplicationSet bm-windows-boot-sources, which generates bm-<version>-boot-source for every
# win*/overlays/bm directory. Sync is manual: a build takes hours.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patches:
- target:
    kind: ApplicationSet
  patch: |-
    - op: replace
      path: /metadata/name
      value: bm-windows-boot-sources
    - op: replace
      path: /spec/generators/0/matrix/generators/0/list/elements/0/cluster
      value: bm
