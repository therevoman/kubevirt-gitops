# Cluster "bm" settings for every Windows boot-source build (winXX/overlays/bm includes this).
# ISO_HOST replaces the host in each install ISO URL; the path (/isos/...) comes from winXX/base.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- settings.yaml
replacements:
- source:
    kind: ConfigMap
    name: windows-cluster-settings
    fieldPath: data.ISO_HOST
  targets:
  - select:
      kind: DataVolume
    options:
      delimiter: /
      index: 2                      # http: / "" / <host> / isos / <file>
    fieldPaths:
    - spec.source.http.url
# Monthly rebuilds (CronJob windows-<OS>-rebuild, see windows/build/README.md) are suspended by
# default. To turn them on for every Windows version on this cluster, uncomment:
# patches:
# - target:
#     kind: CronJob
#   patch: |-
#     - op: replace
#       path: /spec/suspend
#       value: false
