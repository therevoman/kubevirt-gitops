# App-of-apps for cluster "ocs": oc apply -k clusters/ocs
# Creates ApplicationSet ocs-windows-boot-sources, which generates ocs-<version>-boot-source for every
# win*/overlays/ocs directory. Sync is manual: a build takes hours.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patches:
- target:
    kind: ApplicationSet
  patch: |-
    - op: replace
      path: /metadata/name
      value: ocs-windows-boot-sources
    - op: replace
      path: /spec/generators/0/matrix/generators/0/list/elements/0/cluster
      value: ocs
