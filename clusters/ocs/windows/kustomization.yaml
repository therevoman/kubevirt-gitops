# Cluster "ocs" settings for every Windows boot-source build (winXX/overlays/ocs includes this).
# ISO_HOST replaces the host in each install ISO URL; the path (/isos/...) comes from winXX/base.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- settings.yaml
replacements:
- source:
    kind: ConfigMap
    name: windows-cluster-settings
    fieldPath: data.ISO_HOST
  targets:
  - select:
      kind: DataVolume
    options:
      delimiter: /
      index: 2                      # http: / "" / <host> / isos / <file>
    fieldPaths:
    - spec.source.http.url
