# App-of-apps for cluster "snok": oc apply -k clusters/snok
# Creates ApplicationSet snok-windows-boot-sources, which generates snok-<version>-boot-source for every
# win*/overlays/snok directory. Sync is manual: a build takes hours.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patches:
- target:
    kind: ApplicationSet
  patch: |-
    - op: replace
      path: /metadata/name
      value: snok-windows-boot-sources
    - op: replace
      path: /spec/generators/0/matrix/generators/0/list/elements/0/cluster
      value: snok
