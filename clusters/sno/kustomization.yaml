# App-of-apps for cluster "sno": oc apply -k clusters/sno
# Creates ApplicationSet sno-windows-boot-sources, which generates sno-<version>-boot-source for every
# win*/overlays/sno directory. Sync is manual: a build takes hours.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patches:
- target:
    kind: ApplicationSet
  patch: |-
    - op: replace
      path: /metadata/name
      value: sno-windows-boot-sources
    - op: replace
      path: /spec/generators/0/matrix/generators/0/list/elements/0/cluster
      value: sno
