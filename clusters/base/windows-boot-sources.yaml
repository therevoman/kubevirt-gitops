# One Application per Windows version for one cluster: <cluster>-<version>-boot-source, syncing
# <version>/overlays/<cluster> from main. The git generator finds the versions (every
# win*/overlays/<cluster> directory), so a new version needs no change here.
# clusters/<cluster>/kustomization.yaml sets the cluster name. Sync stays manual: a build takes hours.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: CLUSTER-windows-boot-sources
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - cluster: CLUSTER           # set per cluster
      - git:
          repoURL: https://github.com/therevoman/kubevirt-gitops.git
          revision: main
          directories:
          - path: 'win*/overlays/{{ .cluster }}'
  # Deleting the ApplicationSet (or a version directory) must not delete boot sources or builds
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .cluster }}-{{ index .path.segments 0 }}-boot-source'
      namespace: openshift-gitops
      labels:
        kubevirt-gitops/cluster: '{{ .cluster }}'
        kubevirt-gitops/windows-version: '{{ index .path.segments 0 }}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: kubevirt-gitops
      source:
        repoURL: https://github.com/therevoman/kubevirt-gitops.git
        targetRevision: main
        path: '{{ .path.path }}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
